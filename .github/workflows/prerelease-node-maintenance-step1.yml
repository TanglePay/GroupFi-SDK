name: Prerelease flow using prerelease inx plugin

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.GROUPFI_NODEPLUGIN_PRERELEASE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.GROUPFI_NODEPLUGIN_PRERELEASE_HOST_IP }} >> ~/.ssh/known_hosts

    - name: Run SSH Command
      env:
        HOST: ${{ secrets.GROUPFI_NODEPLUGIN_PRERELEASE_HOST_IP }}
        GITHUB_TOKEN: ${{ secrets.GROUPFI_GITHUB_TOKEN }}
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@$HOST << 'ENDSSH'
          sudo su
          cd /mnt/data
          bash cleanhornet.sh
          reboot
        ENDSSH
